name: Formatting GitHub Action

on:
  push:
    branches:
      - main
      - feature/**

jobs:
  quality-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python agent.py

      - name: Commit Generated Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add -A

          if git diff --staged --quiet; then
            echo "No meaningful changes detected"
          else
            git commit -m "Apply Black and Ruff formatting"
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: agent-generated-updates
          base: main
          title: "Apply Black and Ruff Formatting"
          body: |
            Automated changes generated by the formatting agent.

            Includes:
            - Black formatting
            - Ruff lint fixes
          commit-message: "Apply Black and Ruff formatting"